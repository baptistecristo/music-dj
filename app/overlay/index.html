<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* ------------------------------------------------------------------ tokens
     Collapsed, this is a record sleeve sitting on the desk: cover only.
     Hovered, it slides open into liner notes. The why-line is the reason this
     exists rather than any other now-playing widget, so it is set as a margin
     note against a gold rule instead of buried in muted italic. */

  :root {
    --bg: #1b1b1f;
    --raised: #212128;
    --text: #f2f2f4;
    --muted: #8d8d99;
    --dim: #5c5c68;
    --gold: #f5c451;
    --chip: #2c2c34;
    --hairline: #32323c;
    --green: #57c77f;
    --amber: #e0a33e;

    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --utility: "Bahnschrift", "Segoe UI", sans-serif;
    /* Ships with Windows; renders transport marks as crisp vector glyphs
       rather than the colour emoji the unicode media symbols fall back to. */
    --icons: "Segoe Fluent Icons", "Segoe MDL2 Assets";
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%; overflow: hidden;
    /* Transparent so the window's acrylic backdrop shows through. The
       .solid class is the fallback when DWM will not frost the window. */
    background: transparent;
    color: var(--text);
    font-family: var(--display);
    font-size: 12px;
    user-select: none;
    cursor: default;
  }

  /* Dragging is opt-in: pywebview moves the window only when a click lands
     directly on .pywebview-drag-region, so controls stay clickable simply by
     not being tagged. */

  #shell {
    height: 100%;
    display: flex;
    gap: 12px;
    padding: 9px;
    border-radius: 10px;
    /* Glass: tinted enough to keep text legible over a bright desktop, and
       saturated so album colours behind it stay alive rather than going grey. */
    background: rgba(22, 22, 27, .52);
    backdrop-filter: blur(28px) saturate(170%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09),
                inset 0 1px 0 rgba(255,255,255,.13);
  }

  body.solid #shell {
    background: var(--bg);
    backdrop-filter: none;
  }

  /* Collapsed there is nothing but the cover: no glass, no padding, no edge. */
  body:not(.open) #shell {
    padding: 0; gap: 0;
    background: transparent;
    backdrop-filter: none;
    box-shadow: none;
    border-radius: 0;
  }

  /* ------------------------------------------------------------------- cover */

  #cover {
    position: relative;
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--chip);
    /* A sleeve edge, not a drop shadow: one inset hairline. */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09);
    transition: width 160ms ease, height 160ms ease, border-radius 160ms ease;
  }

  /* Collapsed, the cover IS the window: pinned to all four edges so nothing
     of the shell shows around it, and no ring or rounding on top of the art. */
  body:not(.open) #shell { display: block; }

  body:not(.open) #cover {
    position: absolute;
    inset: 0;
    width: auto; height: auto;
    border-radius: 0;
    box-shadow: none;
  }

  #art {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  body.disconnected #art { opacity: .4; filter: grayscale(1); }

  /* Real information, not decoration: how far through the track we are. */
  #progress {
    margin-top: 7px;
    height: 2px;
    border-radius: 1px;
    background: rgba(255,255,255,.10);
  }

  #progress i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--gold);
    transition: width 900ms linear;
  }

  /* -------------------------------------------------------------- liner notes */

  #notes {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 140ms ease 40ms, transform 180ms ease 40ms;
    pointer-events: none;
  }

  body.open #notes { opacity: 1; transform: none; pointer-events: auto; }
  body:not(.open) #notes { display: none; }

  #head {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  #naming { flex: 1 1 auto; min-width: 0; }

  #title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.012em;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #artist {
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #chip {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.09);
    border-radius: 3px;
    padding: 3px 7px;
    font-family: var(--utility);
    font-size: 9.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
  }

  #chip:hover { color: var(--text); }

  #dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
  }

  #chip.pinned #dot { background: var(--amber); }

  /* The signature: Claude's stated reason, set as a margin note. */
  #why {
    margin: 7px 0 0;
    padding-left: 8px;
    border-left: 2px solid var(--gold);
    color: var(--muted);
    font-size: 11px;
    font-style: italic;
    line-height: 1.35;
    max-height: 30px;
    overflow: hidden;
  }

  #why:empty { display: none; }

  /* ----------------------------------------------------------------- controls */

  #controls {
    margin-top: auto;
    padding-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #transport { display: flex; align-items: center; gap: 12px; }

  #transport button {
    background: none; border: none; padding: 0;
    font-family: var(--icons);
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    transition: color 100ms ease;
  }

  #transport button:hover { color: var(--text); }
  #transport button:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }
  #playpause { font-size: 15px; color: var(--text); }

  #stars { display: flex; gap: 2px; }

  #stars span {
    color: var(--dim);
    font-size: 12px;
    cursor: pointer;
    line-height: 1;
    transition: color 90ms ease;
  }

  #stars span.on { color: var(--gold); }
  #stars:hover span { color: var(--dim); }
  #stars span:hover, #stars span:hover ~ span { color: var(--gold); }
  /* Hover fills left-to-right, so the row previews the rating you'd give. */
  #stars { flex-direction: row-reverse; }

  #notice {
    color: var(--dim);
    font-family: var(--utility);
    font-size: 10px;
    letter-spacing: .04em;
    padding-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #notice:empty { display: none; }

  /* ------------------------------------------------------------ mood picker */

  #moods {
    display: none;
    position: absolute;
    right: 8px; top: 30px;
    background: rgba(28, 28, 34, .82);
    backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 6px;
    padding: 3px 0;
    box-shadow: 0 8px 20px rgba(0,0,0,.55);
    z-index: 10;
    min-width: 124px;
    max-height: 210px;
    overflow-y: auto;
  }

  #moods.show { display: block; }

  #moods div {
    padding: 5px 12px;
    font-family: var(--utility);
    font-size: 10.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
  }

  #moods div:hover { background: var(--chip); color: var(--text); }
  #moods div.grouphead {
    color: var(--dim);
    font-size: 9px;
    letter-spacing: .14em;
    padding: 4px 12px 2px;
    cursor: default;
  }

  #moods div.grouphead:hover { background: none; color: var(--dim); }

  #moods div.sep { border-top: 1px solid var(--hairline); margin-top: 3px; padding-top: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="shell" class="pywebview-drag-region">
  <div id="cover" class="pywebview-drag-region">
    <img id="art" class="pywebview-drag-region"
         src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  </div>

  <div id="notes" class="pywebview-drag-region">
    <div id="head" class="pywebview-drag-region">
      <div id="naming" class="pywebview-drag-region">
        <div id="title" class="pywebview-drag-region">Nothing playing</div>
        <div id="artist" class="pywebview-drag-region"></div>
      </div>
      <div id="chip"><span id="dot"></span><span id="moodname">—</span></div>
    </div>

    <div id="why" class="pywebview-drag-region"></div>

    <div id="controls" class="pywebview-drag-region">
      <div id="transport">
        <button data-act="previous" title="Previous">&#xE892;</button>
        <button data-act="playpause" id="playpause" title="Play">&#xE768;</button>
        <button data-act="skip" title="Next">&#xE893;</button>
      </div>
      <div id="stars"></div>
    </div>

    <div id="progress" class="pywebview-drag-region"><i id="bar"></i></div>
    <div id="notice" class="pywebview-drag-region"></div>
  </div>
</div>

<div id="moods"></div>

<script>
// What the hook infers from your activity...
const ACTIVITY = ["coding", "writing", "debugging", "building", "research"];
// ...and the seed directions your taste profile is organised by. The daemon
// takes either, so both are worth offering.
const VIBES = ["energized", "focus", "mellow", "loose", "tense"];
const PLAY = "", PAUSE = "";

const el = (id) => document.getElementById(id);
let state = null;
let ws = null;
let socketUp = false;       // is the daemon reachable at all?
let backoff = 500;
let closeTimer = null;
let open = false;

// ---------------------------------------------------------------- rendering

function render() {
  const np = state && state.nowPlaying;
  document.body.classList.toggle("disconnected", !(state && state.connected));

  if (np && np.title) {
    el("title").textContent = np.title;
    el("artist").textContent = np.artist || "";
  } else {
    // An empty state should say what to do, not just report a void.
    el("title").textContent = !socketUp ? "Daemon not running"
      : (state && state.connected) ? "Nothing playing" : "No DJ tab open";
    el("artist").textContent = !socketUp ? "Start it in your terminal"
      : (state && state.connected) ? "" : "Open music.apple.com";
  }

  el("art").src = (np && np.artworkUrl) ||
    "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";

  const pct = (np && np.duration) ? Math.min(100, (np.position / np.duration) * 100) : 0;
  el("bar").style.width = pct + "%";

  const playing = !!(np && np.playing);
  el("playpause").textContent = playing ? PAUSE : PLAY;
  el("playpause").title = playing ? "Pause" : "Play";

  const mood = (state && state.mood) || {};
  el("moodname").textContent = mood.name || "—";
  const pinned = mood.source === "pinned";
  el("chip").classList.toggle("pinned", pinned);
  el("chip").title = pinned
    ? "You pinned this mood. Click to change or follow your activity again."
    : "Following your activity. Click to pin a mood.";

  el("why").textContent = (state && state.why) || "";
  el("notice").textContent = (state && state.notice) || "";

  const rating = (state && state.rating) || 0;
  el("stars").innerHTML = "";
  // Reversed in the DOM so CSS can light up every star to the left on hover.
  for (let i = 5; i >= 1; i--) {
    const s = document.createElement("span");
    s.textContent = "★";
    s.className = i <= rating ? "on" : "";
    s.title = i + (i === 1 ? " star" : " stars");
    s.onclick = (e) => { e.stopPropagation(); send({action: "rate", stars: i}); };
    el("stars").appendChild(s);
  }
}

// ------------------------------------------------------------------ socket

function connect() {
  try {
    ws = new WebSocket("ws://127.0.0.1:8787/ui");
  } catch (e) {
    return setTimeout(connect, backoff = Math.min(backoff * 2, 10000));
  }
  ws.onopen = () => { backoff = 500; socketUp = true; render(); };
  ws.onmessage = (ev) => {
    try { state = JSON.parse(ev.data); render(); } catch (e) {}
  };
  ws.onclose = () => {
    socketUp = false;
    if (state) state.connected = false;
    render();
    setTimeout(connect, backoff = Math.min(backoff * 2, 10000));
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

function send(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

// ---------------------------------------------------------------- expansion

// CSS cannot grow a frameless OS window, so the resize and the reveal are
// driven together: window first so there is room, then the content fades in.
function expand() {
  clearTimeout(closeTimer);
  if (open) return;
  open = true;
  if (window.pywebview) pywebview.api.expand();
  document.body.classList.add("open");
}

function collapse() {
  clearTimeout(closeTimer);
  // Short delay so the panel does not snap shut when the pointer crosses the
  // gap between the cover and the controls.
  closeTimer = setTimeout(() => {
    open = false;
    el("moods").classList.remove("show");
    document.body.classList.remove("open");
    if (window.pywebview) pywebview.api.collapse();
  }, 250);
}

document.body.addEventListener("mouseenter", expand);
document.body.addEventListener("mouseleave", collapse);

// ------------------------------------------------------------------ actions

el("transport").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  e.stopPropagation();
  const act = btn.dataset.act;
  if (act === "playpause") {
    const playing = !!(state && state.nowPlaying && state.nowPlaying.playing);
    send({action: playing ? "pause" : "resume"});
  } else {
    send({action: act});
  }
});

el("chip").addEventListener("click", (e) => {
  e.stopPropagation();
  const box = el("moods");
  if (!box.innerHTML) {
    const group = (label, moods, first) => {
      const h = document.createElement("div");
      h.textContent = label;
      h.className = "grouphead" + (first ? "" : " sep");
      box.appendChild(h);
      moods.forEach((m) => {
        const d = document.createElement("div");
        d.textContent = m;
        d.onclick = (ev) => {
          ev.stopPropagation();
          send({action: "setMood", mood: m, pinned: true});
          box.classList.remove("show");
        };
        box.appendChild(d);
      });
    };
    group("Vibe", VIBES, true);
    group("Activity", ACTIVITY, false);

    const unpin = document.createElement("div");
    unpin.textContent = "↺ Follow my activity";
    unpin.className = "sep";
    unpin.onclick = (ev) => {
      ev.stopPropagation();
      send({action: "unpin"});
      box.classList.remove("show");
    };
    box.appendChild(unpin);
  }
  box.classList.toggle("show");
});

document.addEventListener("click", () => el("moods").classList.remove("show"));

render();
connect();
</script>
</body>
</html>
